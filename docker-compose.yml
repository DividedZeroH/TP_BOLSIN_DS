services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tpi
      POSTGRES_PASSWORD: tpi
      POSTGRES_DB: tpi_bolsin
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tpi -d tpi_bolsin']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
