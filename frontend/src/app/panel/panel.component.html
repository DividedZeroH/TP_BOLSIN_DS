<main class="panel-shell">
  <section class="panel-header" aria-labelledby="titulo-panel">
    <div>
      <h1 id="titulo-panel">Panel de control</h1>
      <p *ngIf="sesion">Usuario logueado: {{ sesion.usuarioLogueado.email }}</p>
      <p *ngIf="sesion">Comision medica: {{ sesion.comisionMedica.nombre }}</p>
      <p *ngIf="error">No se pudo consultar la sesion. Esta corriendo el backend?</p>
    </div>
  </section>

  <section class="acciones-panel" aria-labelledby="titulo-acciones">
    <div class="section-heading">
      <h2 id="titulo-acciones">Opciones disponibles</h2>
    </div>

    <div class="acciones-grid">
      <a class="accion-card" routerLink="/recepcion-bolsin">
        <strong>Registrar recepcion bolsin</strong>
        <span>Iniciar registro de recepcion de un bolsin.</span>
      </a>
    </div>
  </section>
</main>
