name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificacion:
    name: Lint y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (capas, entidades sin lógica y calidad)
        run: npm run lint

      - name: Build (backend + frontend)
        run: npm run build
